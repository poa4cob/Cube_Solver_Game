name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - "*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cube-solver/package-lock.json

      - name: Install dependencies
        working-directory: cube-solver
        run: npm ci

      - name: Build app
        working-directory: cube-solver
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            base="/${GITHUB_REPOSITORY#*/}/releases/${RELEASE_TAG}/"
          else
            base="/${GITHUB_REPOSITORY#*/}/"
          fi
          npm run build -- --base="$base"

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: cube-solver/dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist

      - name: Prepare retained Pages site
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail

          set +e
          git ls-remote --exit-code --heads origin gh-pages > "$RUNNER_TEMP/gh-pages-ref"
          ref_status=$?
          set -e

          if [[ "$ref_status" -eq 0 ]]; then
            git fetch origin gh-pages
            git worktree add -b gh-pages site FETCH_HEAD
          elif [[ "$ref_status" -eq 2 ]]; then
            git worktree add --detach site HEAD
            git -C site switch --orphan gh-pages
            git -C site clean -fdx
          else
            exit "$ref_status"
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            mkdir -p "site/releases/$RELEASE_TAG"
            find "site/releases/$RELEASE_TAG" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a dist/. "site/releases/$RELEASE_TAG/"
          else
            find site -mindepth 1 -maxdepth 1 ! -name releases ! -name .git -exec rm -rf -- {} +
            cp -a dist/. site/
          fi

          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add -A
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Deploy ${GITHUB_EVENT_NAME} ${RELEASE_TAG:-$GITHUB_SHA}"
            git -C site push origin gh-pages
          fi

          mkdir _site
          cp -a site/. _site/
          rm -f _site/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Attach release build and Pages link
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          release_url="${PAGES_URL%/}/releases/${RELEASE_TAG}/"
          archive="$RUNNER_TEMP/release-pages.zip"
          (cd "_site/releases/$RELEASE_TAG" && zip -qr "$archive" .)
          gh release upload "$RELEASE_TAG" "$archive" --clobber

          body="$RELEASE_BODY"
          if [[ "$body" != *"$release_url"* ]]; then
            body="${body}"$'\n\n'"Deployed Pages: [$RELEASE_TAG]($release_url)"
          fi
          printf '%s' "$body" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
